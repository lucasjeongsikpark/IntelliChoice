- team_member_id: administration-gil-sik-lee-ph-d
  name: Gil Sik Lee, Ph.D.
  role_title: Founder & CEO
  category: Administration
  biography: "Dr. Gil Lee has been a co-founder and the president of IntelliChoice,\
    \ Inc., a non-profit organization\_providing free math tutoring programs for underprivileged\
    \ youths at the Martin Luther King, Jr.\_Library. Prior to IntelliChoice, he created\
    \ and ran a similar program under the name of the Math\_School of Baton Rouge\
    \ from 1993 to 2001 while he was on the faculty of Louisiana State\_University.\
    \ Dr. Lee is currently a Professor of Electrical and Computer Engineering at The\_\
    University of Texas at Dallas, Richardson, Texas. He earned a BS degree in Electronics\
    \ from\_Kyungpook National University in Korea, a MS in Electrical Engineering\
    \ from The University of\_Texas at Austin, and a PhD from North Carolina State\
    \ University (1987). He was a visiting\_scientist at the Naval Research Laboratory\
    \ in Washington, DC in 1991. Dr. Lee has been the\_recipient of many awards, including\
    \ the Ambassador of Diversity Award from UT Dallas (2011),\_the Service Award\
    \ from the Minister of Foreign Affairs of Korea (2012), the Community Hero\_Award\
    \ from Tech Titans (2015), and the IEEE Educational Activities Board Meritorious\
    \ Achievement Award in Informal Education (2017)."
  content_hash: 59f79aab7b89e554153a7199168361a4cb249c382ad7c2ceb25eeab464b22eb1
- team_member_id: administration-jungsoon-lee-ph-d
  name: Jungsoon Lee, Ph.D.
  role_title: Founder & Academic Advisor
  category: Administration
  biography: "Dr. Jungsoon Lee has co-founded Intellichoice and been involved with\
    \ underrepresented students\_in free math tutoring for more than 30 years with\
    \ Dr. Gil Sik Lee. She received her BS and MS in\_Mathematics Education from Kyungpook\
    \ National University in Korea, MS in Mathematics from\_North Carolina State University,\
    \ and PhD in Mathematics from Louisiana State University. She\_was a high school\
    \ teacher for three years in Korea and an associate professor of mathematics at\_\
    Southern University with tenure from 1992 to 2008. She has led successful the\
    \ Summer Enrichment\_Youth Program for at-risk students for three years (2000-2003)\
    \ supported by Louisiana Board of\_Elementary and Secondary Education. She has\
    \ served as a co-chair and the chair of the math\_contest for the middle schools\
    \ and high schools in Louisiana from 2002 to 2008. Each year 400\_to 500 students\
    \ from 25 to 35 schools participated in the contest. She has organized the E2\_\
    Brainiacs Mathematics Competition sponsored by Electrical Engineering Department\
    \ at UTD\_from 2010 to 2012. The goal is to promote an interest in mathematics\
    \ to inspire the next\_generation of great electrical engineers. Currently, she\
    \ is a professor of Electrical and Computer\_Engineering department at UTD and\
    \ is teaching advanced engineering mathematics."
  content_hash: 23f35d9244259a61ec5459a03b4cc883675167fb4880f94beea0f4fa2bfac8c4
