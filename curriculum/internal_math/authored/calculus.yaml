    equal to zero.
  - Rearrange the equation -4x + 20 = 0 so that x is alone on one side.
  canonical_solution:
    steps:
    - step_number: 1
      explanation: To find the maximum profit, we need to find where the derivative of the profit function
        equals zero. This is where the profit stops increasing.
      expression: dP/dx = d/dx[-2x² + 20x - 10]
      common_mistake: null
    - step_number: 2
      explanation: 'Differentiate each term: the derivative of -2x² is -4x, the derivative of 20x is 20,
