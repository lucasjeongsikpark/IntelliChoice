  stem: A boat travels from a dock to an island. The island is 25 miles away in a straight line and 24
    miles due east from the dock. How many miles north of the dock is the island?
  context_block: null
  answer_expression: Eq(x, sqrt(25**2 - 24**2))
  figure_spec: null
  figure_reading: null
  hint_ladder:
  - The boat, dock, and island form a right triangle. Which leg and which side do you know?
  - The straight-line distance is the hypotenuse (25 miles), and the eastward leg is 24 miles. Use the
    Pythagorean theorem to find the northward leg.
  - Write x² + 24² = 25², then solve for x by finding the difference of the squares and taking the square
    root.
  canonical_solution:
    steps:
    - step_number: 1
      explanation: The dock, island, and the point due east of the dock form a right triangle. The straight-line
        distance to the island is the hypotenuse (25 miles), and the eastward distance is one leg (24
        miles). Let x be the northward distance.
      expression: x² + 24² = 25²
      common_mistake: null
    - step_number: 2
      explanation: Substitute the known values and simplify the squares.
      expression: x² + 576 = 625
      common_mistake: null
    - step_number: 3
      explanation: Subtract 576 from both sides to isolate x².
      expression: x² = 49
      common_mistake: null
    - step_number: 4
      explanation: Take the square root of both sides. Since distance is positive, x = 7.
      expression: x = 7
      common_mistake: null
    final_answer: 7 miles
