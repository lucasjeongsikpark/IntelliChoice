  stem: A ladder leans against a wall. The base of the ladder is 9 feet from the wall, and the top reaches
    12 feet up the wall. How long is the ladder?
  context_block: ''
  answer_expression: Eq(x, sqrt(9**2 + 12**2))
  figure_spec: null
  figure_reading: null
  hint_ladder:
  - The ladder, wall, and ground form a right triangle. What are the lengths of the two legs?
  - The Pythagorean theorem says that the square of the ladder's length equals 9² plus 12².
  - Calculate 9² + 12² first, then find the square root of that sum.
  canonical_solution:
    steps:
    - step_number: 1
      explanation: The ladder, wall, and ground form a right triangle. The two legs are 9 feet (base)
        and 12 feet (height). The ladder is the hypotenuse.
      expression: x² = 9² + 12²
      common_mistake: null
    - step_number: 2
      explanation: 'Square each leg: 9² = 81 and 12² = 144.'
      expression: x² = 81 + 144
      common_mistake: null
    - step_number: 3
      explanation: Add the squares together.
      expression: x² = 225
      common_mistake: null
    - step_number: 4
      explanation: Take the square root of both sides to find the ladder's length.
      expression: x = √225 = 15
      common_mistake: null
    final_answer: 15 feet
  random_seed: 1206400
  rendered_question: A ladder leans against a wall. The base of the ladder is 9 feet from the wall, and
    the top reaches 12 feet up the wall. How long is the ladder?
  option_a: 15 feet
  option_b: 21 feet
  option_c: 225 feet
  option_d: 13.5 feet
  correct_option: a
