# Internal curriculum taxonomy — grade band to candidate topic mapping.
# Reference: docs/SPEC.md §5.7.3. The student's school grade narrows the initial
# topic candidates but does not determine the final learning level (assessed
# separately via mastery/placement logic in later sessions).
#
# Only grade bands with a seeded topic are populated below. The full §5.7.3 table
# has 12 bands (K-1 through 11-12); the rest are added as topics are authored for
# them.
#
# **The bands overlap by design** (K-1, 1-2, 2-3, 3-4, ...), and `topic_candidates_for_grade`
# matches a grade against a band's *endpoints*, not a range. So a band cannot be widened by
# renaming it: "1-3" would match grades 1 and 3 and silently drop grade 2. Add the §5.7.3
# band that contains the grade instead.
#
# D-227 added "2-3", because grade 3 was in no populated band and was therefore recommended
# nothing while every topic in the taxonomy was stocked. §5.7.3 calls that band "Multi-digit
# operations, multiplication foundations", and `place_value` - identifying and comparing
# digits in multi-digit whole numbers - is the first half of it.
#
# **The second half is missing, and that is the real finding.** Kumon's grade-3 math
# workbooks (the reference the user named) are addition/subtraction, multiplication,
# division, geometry and word problems; fractions do not appear until grade 4, and even
# there only with *like* denominators. So grade 3 must not be pointed at
# `fraction_operations`, whose harder half is grade-5 work by that measure - and what a
# grade-3 student should actually be studying, multiplication and division, is a topic this
# taxonomy does not have. Mapping the band to `place_value` gives them something rather
# than nothing. See D-227.
grade_topic_candidates:
  "1-2":
    - place_value
  "2-3":
    - place_value
  "4-5":
    - fraction_operations
  "6-7":
    - linear_equations
