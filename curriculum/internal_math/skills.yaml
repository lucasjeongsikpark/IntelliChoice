    name: "Work with functions and their graphs"
    difficulty_tiers: [2, 3, 4]
    # D-309: this field used to contradict itself, and the contradiction was the blocker.
    # It opened with "a bare EXPRESSION ... the answer is the expression" and then closed with
    # "THE EQUATION MUST MATCH WHAT THE STEM ASKS FOR ... not the bare expression". The first
    # sentence sets the model's conception of the item, so it wrote a stem asking for a root
    # and an equation giving the function - 3 of this skill's 14 rejections, all of them AFTER
    # the closing clause was added (clause 2026-08-11, rejections 2026-08-12), which is D-252's
    # record that emphasis does not fix a contradiction. Rewritten as two symmetric kinds with
    # no default, the same remedy D-304 applied one level up.
    structure: "ONE OF TWO KINDS, and the equation form follows from which you chose - never a default. (1) The stem asks for a VALUE (a root, or the output at a given input): write the equation that DERIVES that value - Eq(x**2 - 7*x + 12, 0) for the roots, Eq(x, 2*3**2 - 3*3 + 1) for f(3) - and every option is a number. (2) The stem asks for the FUNCTION (simplify it, compose two, write the rule a table describes): write the bare expression, e.g. 2*x**2 - 3*x + 1, and every option is an expression. Mixing them is the one thing that cannot work: a bare expression derives a symbolic answer, which can never match a numeric option. EVERY DISTRACTOR MUST DIFFER IN VALUE from the answer, not merely in form - an unsimplified or equivalent rewrite is the SAME expression and makes two options correct. Use wrong signs, wrong factors or wrong coefficients."
    answer_family: signed


