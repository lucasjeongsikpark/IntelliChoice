# Internal curriculum taxonomy — skills within each topic.
# Reference: docs/SPEC.md §5.7. Skill ordering within a topic roughly tracks the
# difficulty ladder used for question templates (see prerequisites.yaml).
skills:
  # linear_equations — difficulty 1 through 5 skill ladder.
  - skill_id: linear_one_step
    topic_id: linear_equations
    name: "Solve one-step linear equations"

  - skill_id: linear_two_step
    topic_id: linear_equations
    name: "Solve two-step linear equations"

  - skill_id: linear_neg_frac_coeff
    topic_id: linear_equations
    name: "Solve linear equations with negative or fractional coefficients"

  - skill_id: linear_both_sides
    topic_id: linear_equations
    name: "Solve linear equations with variables on both sides"

  - skill_id: linear_distribute
    topic_id: linear_equations
    name: "Solve linear equations requiring distribution and combining like terms"

  # fraction_operations — no templates authored yet (S9 pipeline volume target).
  - skill_id: fraction_add_sub_like
    topic_id: fraction_operations
    name: "Add and subtract fractions with like denominators"

  - skill_id: fraction_add_sub_unlike
    topic_id: fraction_operations
    name: "Add and subtract fractions with unlike denominators"

  - skill_id: fraction_mul_div
    topic_id: fraction_operations
    name: "Multiply and divide fractions"

  # multiplication_division — grade band 2-3, authored in D-228. The ladder follows
  # Kumon's own grade-3/4 split: facts first, then multi-digit multiplication and
  # division as two branches off it, then remainders.
  - skill_id: mult_facts
    topic_id: multiplication_division
    name: "Multiply within 10 by 10"

  - skill_id: mult_multi_digit
    topic_id: multiplication_division
    name: "Multiply a multi-digit number by a one-digit number"

  - skill_id: div_basic
    topic_id: multiplication_division
    name: "Divide within 100 using the inverse of multiplication"

  - skill_id: div_remainder
    topic_id: multiplication_division
    name: "Divide with remainders"

  # place_value
  - skill_id: place_value_identify
    topic_id: place_value
    name: "Identify the place value of a digit in a multi-digit number"

  - skill_id: place_value_compare
    topic_id: place_value
    name: "Compare and order multi-digit numbers by place value"
