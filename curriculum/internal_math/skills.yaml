  - skill_id: calc_differential_equations
    topic_id: calculus
    name: "Solve a simple differential equation"
    difficulty_tiers: [4, 5]
    # D-309: this skill held 0 items and **9 of 10 candidates died at the design stage**, which
    # is cheap but total. Read from the stored attempts, the model tried the three natural ways
    # to write a differential equation and the validator refused all three:
    #   'dy/dt = -2*y, with y(0) = 5'  -> "is not a single equation"
    #   'Eq(y, 4*exp(-2*t))'           -> "has 2 unknowns, expected exactly one"
    #   'Eq(8, C*exp(-3*0))'           -> "derives the value answer (8,), but final_answer says
    #                                      '8*exp(-3*t)'"
    # The second one IS the intended answer, wrapped. The validator is right to refuse it -
    # `Eq(y, <the answer>)` is D-191's vacuous form, which verifies nothing - and the working
    # form, the bare expression, was never tried because "equation" invites the wrapper and the
    # example below did not say otherwise. Fourth occurrence of one shape: the skill never said
    # which of the five answer models it wants.
    #
    # **The rewrite below did NOT work, and saying so is the point (D-252's record).** Measured:
    # 9 of 10 design failures before it, 9 of 10 after, and the model still never wrote a bare
    # expression once - it wrote `dy/dt = -0.05*y, with y(0) = 100`, `Eq(y, 50*exp(-0.1*t))`,
    # `dP/dt = 3*P; P(0) = 2`. The reason it cannot be fixed here is one level up: the design
    # validator's own refusal says "model the question as one relation with one unknown, e.g.
    # 'Eq(3 + 7*m, 4 + 4*m)'" - a **value** example, the one form a differential equation cannot
    # take - so the feedback pushes the model back to the model that cannot work. Turning the
    # design stage off entirely (`--design-attempts 0`) does not help either: 8 of 10 then fail
    # the gate because the generator, unconstrained, writes arithmetic word problems and calls
    # them calculus (`Eq(8 + 0.5*t, h)`, "a population growing by 8 per month", `B = 8t`).
    # Three levers, three failure modes, 0 items each time, $1.14. This skill is unauthorable by
    # the pipeline as it stands; it needs an answer-model-aware design refusal, or hand
    # authoring the way family-C figures were (D-279). Kept because it states what the gate
    # actually needs, not because it changed anything.
    structure: "the equation field is a BARE EXPRESSION and nothing else - no 'Eq(...)' wrapper, no 'y =', no initial condition appended, because the answer IS the function and is checked by equivalence. Write 3*exp(2*t), never Eq(y, 3*exp(2*t)) and never 'dy/dt = 2*y'; solve the differential equation yourself and give its solution. Options and every student-facing field use student notation instead: 3e^(2t), never 3*exp(2*t), because an asterisk is refused as programmer notation. EVERY DISTRACTOR MUST DIFFER IN VALUE from the answer, not merely in form: an unsimplified or equivalent rewrite is the SAME expression and makes two options correct. Use wrong signs, wrong coefficients or a wrong rate in the exponent instead."
    answer_family: signed


