# Internal curriculum taxonomy — skills within each topic.
# Reference: docs/SPEC.md §5.7. Skill ordering within a topic roughly tracks the
# difficulty ladder used for question templates (see prerequisites.yaml).
skills:
  # linear_equations — difficulty 1 through 5 skill ladder.
  - skill_id: linear_one_step
    topic_id: linear_equations
    name: "Solve one-step linear equations"
    difficulty_tiers: [1, 2]
    structure: "exactly one operation to undo, e.g. Eq(x + 8, 20) or Eq(4*x, 20)"

  - skill_id: linear_two_step
    topic_id: linear_equations
    name: "Solve two-step linear equations"
    difficulty_tiers: [1, 2, 3]
    structure: "two operations, the variable on ONE side only, e.g. Eq(18 + 6*w, 60)"

  - skill_id: linear_neg_frac_coeff
    topic_id: linear_equations
    name: "Solve linear equations with negative or fractional coefficients"
    difficulty_tiers: [2, 3, 4]
    structure: "a negative or fractional coefficient on the variable, e.g. Eq(60 - 4*x, 12) or
      Eq(x/3 + 5, 11)"

  - skill_id: linear_both_sides
    topic_id: linear_equations
    name: "Solve linear equations with variables on both sides"
    difficulty_tiers: [3, 4, 5]
    structure: "the variable MUST appear on BOTH sides of the equals sign, e.g. Eq(8 + 2*m, 18 +
      m) - an equation with the variable on one side is wrong for this skill however hard it is
      otherwise"

  - skill_id: linear_distribute
    topic_id: linear_equations
    name: "Solve linear equations requiring distribution and combining like terms"
    difficulty_tiers: [5]
    structure: "a bracket that MUST be distributed before like terms can be combined, e.g.
      Eq(5*(c + 2) + 12, 42)"

  # fraction_operations — no templates authored yet (S9 pipeline volume target).
  - skill_id: fraction_add_sub_like
    topic_id: fraction_operations
    name: "Add and subtract fractions with like denominators"
    answer_family: rational

  - skill_id: fraction_add_sub_unlike
    topic_id: fraction_operations
    name: "Add and subtract fractions with unlike denominators"
    answer_family: rational

  - skill_id: fraction_mul_div
    topic_id: fraction_operations
    name: "Multiply and divide fractions"
    answer_family: rational

  # multiplication_division — grade band 2-3, authored in D-228. The ladder follows
  # Kumon's own grade-3/4 split: facts first, then multi-digit multiplication and
  # division as two branches off it, then remainders.
  - skill_id: mult_facts
    topic_id: multiplication_division
    name: "Multiply within 10 by 10"

  - skill_id: mult_multi_digit
    topic_id: multiplication_division
    name: "Multiply a multi-digit number by a one-digit number"

  - skill_id: div_basic
    topic_id: multiplication_division
    name: "Divide within 100 using the inverse of multiplication"

  - skill_id: div_remainder
    topic_id: multiplication_division
    name: "Divide with remainders"

  # C1 wave K-2 (D-273). Two or three skills per book, not one per source row - the rows are
  # the difficulty ladder. `curriculum/coverage/skill_groups.yaml` records the row->skill map.
  # The `*_three_numbers` skills are separate strands rather than a top tier of their
  # neighbours: choosing an order before calculating is different work from calculating once,
  # and D-238 measured what happens when two kinds of work share one rubric.
  - skill_id: g1_add_within_10
    topic_id: g1_addition
    name: "Add within 10"
    difficulty_tiers: [1, 2]
    structure: "one addition of two single-digit numbers with a total of 10 or less, e.g. Eq(x,
      6 + 3) - no bridging through ten"

  - skill_id: g1_add_within_20
    topic_id: g1_addition
    name: "Add by bridging through ten"
    difficulty_tiers: [2, 3, 4]
    structure: "one addition of two single-digit numbers whose total is between 11 and 20, so
      ten is crossed, e.g. Eq(x, 8 + 5)"

  - skill_id: g1_add_within_28
    topic_id: g1_addition
    name: "Add with totals past twenty"
    difficulty_tiers: [2, 3, 4, 5]
    structure: "one addition whose total passes 20, e.g. Eq(x, 19 + 9) - a second ten must be
      reached"

  - skill_id: g1_sub_within_10
    topic_id: g1_subtraction
    name: "Subtract within 10"
    difficulty_tiers: [1, 2]
    structure: "one subtraction from a total of 10 or less, e.g. Eq(x, 9 - 4), or the same as a
      missing addend, e.g. Eq(4 + x, 9)"

  - skill_id: g1_sub_within_20
    topic_id: g1_subtraction
    name: "Subtract within 20 by breaking a ten"
    difficulty_tiers: [2, 3, 4]
    structure: "one subtraction from a total between 11 and 20 where the total's ones digit is
      SMALLER than the amount taken, so a ten must be broken, e.g. Eq(x, 14 - 6)"

  - skill_id: g1_sub_three_numbers
    topic_id: g1_subtraction
    name: "Combine three one-digit numbers"
    difficulty_tiers: [4, 5]
    structure: "three one-digit numbers combined in one expression, e.g. Eq(x, 12 - 3 - 4) - two
      operations, not one"

  - skill_id: g1_wp_single_operation
    topic_id: g1_word_problems
    name: "Solve a word problem using the operation the story names"
    difficulty_tiers: [1, 2, 4]
    structure: "one operation the story names outright, on totals within 20, e.g. Eq(x, 7 + 5) -
      or a missing-part form, Eq(7 + x, 12)"

  - skill_id: g1_wp_choose_operation
    topic_id: g1_word_problems
    name: "Decide which operation a situation calls for"
    difficulty_tiers: [2, 3, 4, 5]
    structure: "one operation the story does NOT name, so the situation decides it, e.g. Eq(13 -
      x, 5) for how many were taken away"

  - skill_id: g2_add_within_100
    topic_id: g2_addition
    name: "Add two-digit numbers within 100"
    difficulty_tiers: [1, 2, 3]
    structure: "addition of two-digit numbers totalling at most 100, e.g. Eq(x, 37 + 25)"

  - skill_id: g2_add_multi_digit
    topic_id: g2_addition
    name: "Add three- and four-digit numbers"
    difficulty_tiers: [3, 4]
    structure: "addition of three- or four-digit numbers carrying in more than one column, e.g.
      Eq(x, 2478 + 1365)"

  - skill_id: g2_add_three_numbers
    topic_id: g2_addition
    name: "Add three numbers"
    difficulty_tiers: [5]
    structure: "three numbers added in one expression, e.g. Eq(x, 46 + 27 + 18)"

  - skill_id: g2_sub_two_digit
    topic_id: g2_subtraction
    name: "Subtract two-digit numbers"
    difficulty_tiers: [1, 2, 3]
    structure: "subtraction of two-digit numbers, e.g. Eq(x, 52 - 27), or the missing-addend
      form Eq(27 + x, 52)"

  - skill_id: g2_sub_multi_digit
    topic_id: g2_subtraction
    name: "Subtract three- and four-digit numbers"
    difficulty_tiers: [4]
    structure: "subtraction of three- or four-digit numbers where the borrow travels across a
      zero, e.g. Eq(x, 400 - 128)"

  - skill_id: g2_sub_three_numbers
    topic_id: g2_subtraction
    name: "Subtract with three numbers"
    difficulty_tiers: [4, 5]
    structure: "three numbers combined in one expression with at least one subtraction, e.g.
      Eq(x, 95 - 27 - 18)"

  - skill_id: g2_wp_single_operation
    topic_id: g2_word_problems
    name: "Solve a two-digit word problem with one operation"
    difficulty_tiers: [1, 2]
    structure: "one operation on two-digit quantities, e.g. Eq(x, 48 + 27)"

  - skill_id: g2_wp_measurement_context
    topic_id: g2_word_problems
    name: "Solve a word problem whose quantities carry units"
    difficulty_tiers: [2, 3, 4]
    structure: "one operation whose quantities carry a unit that must appear in the answer, e.g.
      Eq(x, 145 - 68) for centimetres"

  - skill_id: g2_wp_multi_step
    topic_id: g2_word_problems
    name: "Solve a word problem needing two operations"
    difficulty_tiers: [2, 5]
    structure: "TWO operations where the first result feeds the second, e.g. Eq(x, (24 + 18) -
      15) - a single operation is wrong for this skill however large the numbers are"

  # place_value
  - skill_id: place_value_identify
    topic_id: place_value
    name: "Identify the place value of a digit in a multi-digit number"

  - skill_id: place_value_compare
    topic_id: place_value
    name: "Compare and order multi-digit numbers by place value"

  # ====================================================================================
  # C1 wave 3-5 (D-274). 26 skills across seven topics. Names are student-visible in the
  # progress display (SPEC §5.10.3 - the *id* stays internal), so they read as things a
  # student does, not as taxonomy labels.
  # ====================================================================================

  # g4_multiplication_division
  - skill_id: g4_mult_by_one_digit
    topic_id: g4_multiplication_division
    name: "Multiply a multi-digit number by a single digit"
    difficulty_tiers: [1, 2]
    structure: "one multiplication of a multi-digit number by a SINGLE digit, e.g. Eq(x, 428 *
      6)"

  - skill_id: g4_mult_two_by_two
    topic_id: g4_multiplication_division
    name: "Multiply a two-digit number by a two-digit number"
    difficulty_tiers: [2, 3, 4]
    structure: "one multiplication of a two-digit number by a TWO-digit number, e.g. Eq(x, 47 *
      32) - a single-digit factor is wrong for this skill however large the other one is"

  - skill_id: g4_mult_large
    topic_id: g4_multiplication_division
    name: "Multiply large numbers, and multiply three numbers together"
    difficulty_tiers: [3, 4, 5]
    structure: "a multiplication with at least three digits in each factor, e.g. Eq(x, 412 *
      236), or THREE factors in one expression, e.g. Eq(x, 12 * 8 * 5)"

  - skill_id: g4_div_by_one_digit
    topic_id: g4_multiplication_division
    name: "Divide a multi-digit number by a single digit"
    difficulty_tiers: [1, 2, 3]
    structure: "one division of a multi-digit number by a SINGLE digit, e.g. Eq(x, 4536 / 8), or
      the same as a missing factor, e.g. Eq(8 * x, 4536)"

  - skill_id: g4_div_by_two_digit
    topic_id: g4_multiplication_division
    name: "Divide by a two-digit number"
    difficulty_tiers: [3, 4, 5]
    structure: "one division by a TWO-digit divisor, e.g. Eq(x, 3216 / 24) - a single-digit
      divisor is wrong for this skill, because estimating the partial quotient is the whole
      point"

  # decimals
  - skill_id: decimal_add_sub
    topic_id: decimals
    name: "Add and subtract decimals"
    difficulty_tiers: [1, 2, 3]
    structure: "one addition or subtraction of decimals, e.g. Eq(x, 3.75 + 2.4) - the answer is
      a decimal and must not be rounded to a whole number"
    answer_family: rational

  - skill_id: decimal_multiply
    topic_id: decimals
    name: "Multiply decimals"
    difficulty_tiers: [3, 4]
    # D-275: "at least one factor is a decimal" let the first real run author `2.5 * 12` and
    # `3.5 * 8` - decimal times WHOLE NUMBER, whose answers (30, 28) are whole. 0 of 2 items
    # produced a non-whole answer, so the skill the `rational` family was added for was not
    # being exercised at all. BOTH factors must be decimals, which is also what makes the
    # skill's actual work - the answer's decimal places being the sum of the factors' - exist.
    structure: "one multiplication where BOTH factors are decimals, e.g. Eq(x, 2.5 * 1.4) -
      a decimal times a whole number is the easier skill and is wrong for this slot, because
      the point is that the answer's decimal places are the SUM of the two factors'"
    answer_family: rational

  - skill_id: decimal_divide
    topic_id: decimals
    name: "Divide decimals"
    difficulty_tiers: [4, 5]
    # D-275: the structure was satisfied and the skill still was not exercised. All six items
    # from the first run were "how many 0.9 m pieces fit in 6.3 m" - a divisor that divides
    # evenly, so 4 of 6 answers were whole and the decimal never reached the quotient. The
    # "how many whole pieces" framing is what forces that, so the structure now rules it out.
    structure: "one division where the DIVISOR is a decimal AND the quotient is itself a
      decimal, e.g. Eq(x, 8.4 / 0.5) - avoid 'how many whole pieces fit' scenarios, which
      force an even division and hide the skill; dividing by a whole number is the easier
      skill and is wrong for this slot either way"
    answer_family: rational

  # number_sense
  - skill_id: number_odd_even
    topic_id: number_sense
    name: "Tell odd numbers from even numbers"
    difficulty_tiers: [1, 2]
    # D-276: same defect as `number_large_compare` below. A shipped item asked "is 47 odd or
    # even" with options "Odd"/"Even" - the equation derives 1 and no word can match it. The
    # stem has to ask for the REMAINDER, not for the classification the remainder implies.
    structure: "the remainder on division by two, e.g. Eq(x, Mod(47, 2)). The STEM MUST ASK FOR
      THE REMAINDER - 'what is the remainder when 47 is divided by 2?' - and the four OPTIONS
      MUST BE NUMBERS (0, 1, 2, 3). Options that are the words 'Odd' and 'Even' cannot be
      verified, because the answer is checked by deriving the remainder; state in the stem that
      a remainder of 1 means odd and 0 means even, so the student still learns the rule"

  - skill_id: number_large_compare
    topic_id: number_sense
    name: "Compare and order large numbers"
    difficulty_tiers: [1, 2, 3]
    # D-276: the Max form only verifies when the OPTIONS ARE THE NUMBERS. Two shipped items
    # asked "which museum raised the most" with options like "Museum B" - the equation derives
    # 86892 and no label can match it, so the gate rejected an item whose maths was fine. The
    # options requirement is now part of the structure, because it is what makes the form work.
    structure: "a comparison expressed with Max or Min over the numbers being compared, e.g.
      Eq(x, Max(34281, 34218, 34128)) - the answer IS one of the stated numbers, and writing
      Eq(x, 34281) instead states the answer rather than modelling the question. The four
      OPTIONS MUST BE THE NUMBERS THEMSELVES (34281, 34218, ...), never labels like
      'Museum B' or 'City A' - the answer is verified by deriving the number, so an option
      naming an entity cannot be matched and the item is rejected"

  - skill_id: number_rounding
    topic_id: number_sense
    name: "Round a number to a given place"
    difficulty_tiers: [2, 3, 4, 5]
    # This skill spans both answer kinds and is `rational` for that reason, not because every
    # answer is non-whole: rounding 4738 to the nearest hundred gives the whole 4700, while
    # tier 4's own anchor rounds a DECIMAL to a named place and gives 3.5. `rational` permits
    # a non-whole answer, it does not require one - and the structure has to say so, or the
    # decimal half goes unauthored the way `decimal_multiply`'s did (D-275).
    structure: "a rounding written as the arithmetic that performs it, e.g. Eq(x, 100 *
      round(4738 / 100)) for the nearest hundred - never Eq(x, 4700), which states the answer.
      At tier 4 and above round a DECIMAL to a named place, e.g.
      Eq(x, Rational(1,10) * round(3.472 * 10)), where the answer is itself a decimal"
    answer_family: rational

  # measurement
  - skill_id: measurement_length
    topic_id: measurement
    name: "Work with lengths, including converting between units"
    difficulty_tiers: [1, 2, 3]
    structure: "one operation on lengths, with a conversion written into the equation where two
      units appear, e.g. Eq(x, 3 * 100 + 40) for 3 m 40 cm in centimetres"

  - skill_id: measurement_weight
    topic_id: measurement
    name: "Work with weights, including converting between units"
    difficulty_tiers: [2, 3]
    structure: "one operation on weights, with a conversion written into the equation where two
      units appear, e.g. Eq(x, 2 * 1000 + 350) for 2 kg 350 g in grams"

  - skill_id: measurement_capacity
    topic_id: measurement
    name: "Work with capacity, including converting between units"
    difficulty_tiers: [2, 3]
    structure: "one operation on capacities, with a conversion written into the equation where
      two units appear, e.g. Eq(x, 1 * 1000 + 250) for 1 L 250 mL in millilitres"

  - skill_id: measurement_money
    topic_id: measurement
    name: "Work with amounts of money"
    difficulty_tiers: [1, 2]
    structure: "one operation on amounts of money, e.g. Eq(x, 12.50 - 4.75) - the answer is an
      amount and may have cents"
    answer_family: rational

  - skill_id: measurement_elapsed_time
    topic_id: measurement
    name: "Work out how much time has passed"
    difficulty_tiers: [3, 4]
    structure: "an elapsed time computed in one unit, e.g. Eq(x, (14*60 + 20) - (11*60 + 45))
      for the minutes between 11:45 and 14:20 - the sixties must appear in the equation"

  - skill_id: measurement_area_volume
    topic_id: measurement
    name: "Find an area or a volume from given lengths"
    difficulty_tiers: [4, 5]
    structure: "an area as a product of two given lengths, e.g. Eq(x, 14 * 9), or a volume as a
      product of three, e.g. Eq(x, 6 * 4 * 3)"

  # g3_word_problems
  - skill_id: g3_wp_add_sub
    topic_id: g3_word_problems
    name: "Solve an addition or subtraction word problem on larger quantities"
    difficulty_tiers: [1, 2]
    structure: "one addition or subtraction on three- or four-digit quantities, e.g. Eq(x, 1250
      + 830), or the missing-part form Eq(830 + x, 2080)"

  - skill_id: g3_wp_mult_div
    topic_id: g3_word_problems
    name: "Solve a word problem about equal groups or sharing"
    difficulty_tiers: [2, 3, 4, 5]
    structure: "one multiplication or division arising from equal groups or sharing, e.g. Eq(x,
      24 * 6) or Eq(x, 144 / 6) - the story must not name the operation"

  - skill_id: g3_wp_mixed
    topic_id: g3_word_problems
    name: "Solve a word problem needing two operations"
    difficulty_tiers: [2, 3, 4, 5]
    structure: "TWO operations where the first result feeds the second, e.g. Eq(x, (24 * 6) -
      45)"

  # g4_word_problems
  - skill_id: g4_wp_division
    topic_id: g4_word_problems
    name: "Solve a division word problem on multi-digit quantities"
    difficulty_tiers: [1, 2]
    structure: "one division with a multi-digit dividend, e.g. Eq(x, 1728 / 12)"

  - skill_id: g4_wp_decimals
    topic_id: g4_word_problems
    name: "Solve a word problem about decimal quantities"
    difficulty_tiers: [2, 3]
    structure: "one operation on decimal quantities, most often money, e.g. Eq(x, 45.60 / 8)"
    answer_family: rational

  - skill_id: g4_wp_formula_mixed
    topic_id: g4_word_problems
    name: "Apply a given formula, and solve problems needing two operations"
    difficulty_tiers: [2, 3, 4, 5]
    structure: "a stated formula applied to given quantities, e.g. Eq(x, 2 * (14 + 9)) for the
      perimeter of a rectangle, or two operations of different kinds in one expression"

  # g5_word_problems
  # Tier 1 was added 2026-08-12 (C1 Phase 3): this topic's three skills spanned [2,3], [3,4]
  # and [4,5], so its authoring plan could not schedule a difficulty-1 item at all - and a
  # topic serves only when *every* tier 1-5 holds two approved items (D-187 × QUESTIONS_PER_
  # DIFFICULTY). `g5_word_problems` was therefore unopenable by construction, not by yield.
  # The easiest skill carries tier 1 here exactly as `g4_wp_division` does in the sibling
  # topic, and a fraction OF a quantity ("half of 30") is honest grade-5 tier-1 work.
  - skill_id: g5_wp_fractions
    topic_id: g5_word_problems
    name: "Solve a word problem about fractions"
    difficulty_tiers: [1, 2, 3]
    # The two forms below are NOT interchangeable, and saying so is what makes tier 1
    # reachable. Offered as equal alternatives, the generator wrote "three-fourths of 24"
    # for every tier-1 slot and the judge rated all three difficulty 3 - correctly, since
    # this topic's own d3 anchor is "a fraction OF a quantity". The skill spans both forms;
    # the tier decides which one.
    structure: "one operation on two fractions, written with Rational, e.g. Eq(x,
      Rational(3,4) - Rational(1,6)) - like denominators at tier 1, unlike at tier 2. A
      fraction OF a quantity, e.g. Eq(x, Rational(2,5) * 350), is the tier-3 form only"
    answer_family: rational

  - skill_id: g5_wp_decimals
    topic_id: g5_word_problems
    name: "Solve a word problem about decimals"
    difficulty_tiers: [2, 3, 4]
    structure: "one multiplication or division involving a decimal, e.g. Eq(x, 3.6 * 2.5)"
    answer_family: rational

  - skill_id: g5_wp_ratios_mixed
    topic_id: g5_word_problems
    name: "Solve a word problem about ratios and shares"
    difficulty_tiers: [3, 4, 5]
    structure: "a share of a total split in a given ratio, written as the arithmetic that finds
      it, e.g. Eq(x, 45 * 3 / 9) for the 3-part share of 45 split 3:6"

  # ==================================================================================
  # C1 waves 6-8 and 9-12 (D-277). 53 skills over twelve topics.
  #
  # **The first skills whose answers are not single values.** `alg_inequalities` answers
  # a RANGE, `alg1_systems` a PAIR, `alg1_factorization` an EXPRESSION. Phase R built
  # those verifiers and nothing had used them; D-277 had to route the design gate too,
  # because it still demanded one equation, one unknown, one solution.
  #
  # **Two answer families are new here and were deliberately withheld until now** (D-274
  # said a family gets added when a topic needs it): `integer` for skills that are about
  # negative whole numbers, and `signed` for algebra and calculus, whose answers carry
  # no sign or roundness rule at all.
  # ==================================================================================

  # g6_fractions
  - skill_id: g6_fraction_reduce
    topic_id: g6_fractions
    name: "Reduce a fraction to lowest terms"
    difficulty_tiers: [1, 2]
    # The distractor rule is the load-bearing sentence. A "lowest terms" question's most
    # natural wrong answer is the *unreduced* form - and that form is equal in VALUE to the
    # answer, so `check_sympy_independent_solve` reports two options matching and refuses
    # the item. All three tier-1 candidates in the C1 Phase 3 batch died that way (6/8
    # beside 3/4, 4/6 beside 2/3). The gate is right on its own terms: two options a student
    # cannot tell apart must never both be on screen. What it costs is this skill's best
    # distractor, so the constraint is stated to the author instead.
    # D-308 removes the distractor prohibition above, because the gate can now read the
    # difference the prohibition existed to avoid. Measured before changing it: this skill had
    # **0 items in the bank** - every candidate it ever produced died on the equal-value rule,
    # 29 of them - and D-306 measured the repair path against it at 0 of 4 twice, because
    # "several equivalent fractions, pick the reduced one" *is* the model's conception of the
    # item. It was right and the gate could not see it.
    structure: "one fraction written as a division that reduces, e.g. Eq(x, Rational(24, 36))
      - the answer is the reduced fraction, so it must not be a whole number. Distractors
      SHOULD include unreduced equivalents of the answer (4/6 and 6/9 beside 2/3): that is
      the misconception this skill tests, and exactly one option being in lowest terms is
      what makes the question answerable"
    answer_family: rational
    answer_form: lowest_terms

  - skill_id: g6_fraction_mul_div
    topic_id: g6_fractions
    name: "Multiply and divide fractions"
    difficulty_tiers: [2, 3, 4]
    structure: "one multiplication or division of two fractions written with Rational, e.g.
      Eq(x, Rational(3,4) * Rational(2,5)) or Eq(x, Rational(3,4) / Rational(2,5))"
    answer_family: rational

  - skill_id: g6_fraction_decimal_percent
    topic_id: g6_fractions
    name: "Convert between fractions, decimals and percents"
    difficulty_tiers: [2, 3, 4, 5]
    structure: "a conversion written as the arithmetic that performs it, e.g. Eq(x,
      Rational(3,8)) for a fraction as a decimal, or Eq(x, 0.45 * 100) for a decimal as a
      percent"
    answer_family: rational


  # g6_word_problems
  - skill_id: g6_wp_average
    topic_id: g6_word_problems
    name: "Find an average from a set of values"
    difficulty_tiers: [1, 2]
    structure: "a mean written as a sum over a count, e.g. Eq(x, (82 + 91 + 76) / 3)"
    answer_family: rational

  - skill_id: g6_wp_rate_speed
    topic_id: g6_word_problems
    name: "Work with speed, distance and rates"
    difficulty_tiers: [1, 2, 3, 4]
    structure: "a rate relationship written as one expression, e.g. Eq(x, 240 / 3) for speed
      from distance and time, or Eq(x, 60 * 2.5) for distance from speed and time"
    answer_family: rational

  - skill_id: g6_wp_ratio_proportion
    topic_id: g6_word_problems
    name: "Solve ratio and proportion problems"
    difficulty_tiers: [2, 3, 4, 5]
    structure: "a share of a total split in a ratio, or a proportion solved for the missing
      quantity, e.g. Eq(x, 45 * 3 / 9) or Eq(x / 12, 15 / 4)"
    answer_family: rational


