# Internal curriculum taxonomy — skills within each topic.
# Reference: docs/SPEC.md §5.7. Skill ordering within a topic roughly tracks the
# difficulty ladder used for question templates (see prerequisites.yaml).
skills:
  # linear_equations — difficulty 1 through 5 skill ladder.
  - skill_id: linear_one_step
    topic_id: linear_equations
    name: "Solve one-step linear equations"

  - skill_id: linear_two_step
    topic_id: linear_equations
    name: "Solve two-step linear equations"

  - skill_id: linear_neg_frac_coeff
    topic_id: linear_equations
    name: "Solve linear equations with negative or fractional coefficients"

  - skill_id: linear_both_sides
    topic_id: linear_equations
    name: "Solve linear equations with variables on both sides"

  - skill_id: linear_distribute
    topic_id: linear_equations
    name: "Solve linear equations requiring distribution and combining like terms"

  # fraction_operations — no templates authored yet (S9 pipeline volume target).
  - skill_id: fraction_add_sub_like
    topic_id: fraction_operations
    name: "Add and subtract fractions with like denominators"

  - skill_id: fraction_add_sub_unlike
    topic_id: fraction_operations
    name: "Add and subtract fractions with unlike denominators"

  - skill_id: fraction_mul_div
    topic_id: fraction_operations
    name: "Multiply and divide fractions"

  # multiplication_division — grade band 2-3, authored in D-228. The ladder follows
  # Kumon's own grade-3/4 split: facts first, then multi-digit multiplication and
  # division as two branches off it, then remainders.
  - skill_id: mult_facts
    topic_id: multiplication_division
    name: "Multiply within 10 by 10"

  - skill_id: mult_multi_digit
    topic_id: multiplication_division
    name: "Multiply a multi-digit number by a one-digit number"

  - skill_id: div_basic
    topic_id: multiplication_division
    name: "Divide within 100 using the inverse of multiplication"

  - skill_id: div_remainder
    topic_id: multiplication_division
    name: "Divide with remainders"

  # C1 wave K-2 (D-273). Two or three skills per book, not one per source row - the rows are
  # the difficulty ladder. `curriculum/coverage/skill_groups.yaml` records the row->skill map.
  # The `*_three_numbers` skills are separate strands rather than a top tier of their
  # neighbours: choosing an order before calculating is different work from calculating once,
  # and D-238 measured what happens when two kinds of work share one rubric.
  - skill_id: g1_add_within_10
    topic_id: g1_addition
    name: "Add within 10"

  - skill_id: g1_add_within_20
    topic_id: g1_addition
    name: "Add by bridging through ten"

  - skill_id: g1_add_within_28
    topic_id: g1_addition
    name: "Add with totals past twenty"

  - skill_id: g1_sub_within_10
    topic_id: g1_subtraction
    name: "Subtract within 10"

  - skill_id: g1_sub_within_20
    topic_id: g1_subtraction
    name: "Subtract within 20 by breaking a ten"

  - skill_id: g1_sub_three_numbers
    topic_id: g1_subtraction
    name: "Combine three one-digit numbers"

  - skill_id: g1_wp_single_operation
    topic_id: g1_word_problems
    name: "Solve a word problem using the operation the story names"

  - skill_id: g1_wp_choose_operation
    topic_id: g1_word_problems
    name: "Decide which operation a situation calls for"

  - skill_id: g2_add_within_100
    topic_id: g2_addition
    name: "Add two-digit numbers within 100"

  - skill_id: g2_add_multi_digit
    topic_id: g2_addition
    name: "Add three- and four-digit numbers"

  - skill_id: g2_add_three_numbers
    topic_id: g2_addition
    name: "Add three numbers"

  - skill_id: g2_sub_two_digit
    topic_id: g2_subtraction
    name: "Subtract two-digit numbers"

  - skill_id: g2_sub_multi_digit
    topic_id: g2_subtraction
    name: "Subtract three- and four-digit numbers"

  - skill_id: g2_sub_three_numbers
    topic_id: g2_subtraction
    name: "Subtract with three numbers"

  - skill_id: g2_wp_single_operation
    topic_id: g2_word_problems
    name: "Solve a two-digit word problem with one operation"

  - skill_id: g2_wp_measurement_context
    topic_id: g2_word_problems
    name: "Solve a word problem whose quantities carry units"

  - skill_id: g2_wp_multi_step
    topic_id: g2_word_problems
    name: "Solve a word problem needing two operations"

  # place_value
  - skill_id: place_value_identify
    topic_id: place_value
    name: "Identify the place value of a digit in a multi-digit number"

  - skill_id: place_value_compare
    topic_id: place_value
    name: "Compare and order multi-digit numbers by place value"
