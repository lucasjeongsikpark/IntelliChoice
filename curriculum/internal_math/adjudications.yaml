# Human verdicts on §5.8.5 judge findings (D-236), so a repeat audit reports what is NEW.
#
# D-235 adjudicated 25 disagreements between an item's declared tier and the tier the blind
# judge gave it. 13 were the judge being right and were fixed by re-tiering; 12 were the
# judge being wrong and, until D-236, were recorded nowhere - so the next `--judge` run would
# have re-reported them as twelve fresh findings.
#
# **Re-decided in D-237, not inherited.** The tier-5 prompt sentence lapsed all 12 `upheld`
# verdicts by design, and re-running the judge on exactly those items showed **8 of the 12
# had become moot** - the instrument now agrees, so there is nothing left to suppress and
# those entries were deleted rather than carried. The 4 below still disagree by >= 2 and are
# re-affirmed against the new prompt.
#
# `fingerprint` scope depends on what the verdict claims (D-237):
#   upheld   - "the judge is wrong about this item": item payload + anchors + judge prompt.
#   retiered - "this item's tier should be X by its anchors": item payload + anchors only.
#              The judge prompt is not an input to a human reading of content against a
#              rubric, and must not be able to invalidate one.
#
# Only `upheld` suppresses. A `retiered` item was changed to match the judge, so it is now
# expected to agree and a remaining disagreement is news, not a repeat.
