# Human verdicts on §5.8.5 judge findings (D-236), so a repeat audit reports what is NEW.
#
# D-235 adjudicated 25 disagreements between an item's declared tier and the tier the
# blind judge gave it. 13 were the judge being right and were fixed by re-tiering; 12
# were the judge being wrong and, until this file, were recorded nowhere - so the next
# `audit_authored_bank.py --judge` would have re-reported them as twelve fresh findings.
#
# `fingerprint` covers the item's judge payload, its topic's difficulty_anchors, and the
# judge system prompt. Any of the three changing lapses the verdict, deliberately: a
# verdict is a claim about a specific instrument and is not inherited by a different one.
# See `adjudications.py` for why that fragility is the point rather than a cost.
#
# `judge_difficulty` is historical - what prompted the verdict, measured in the D-234 run.
# For `place_value` and `fraction_operations` that run used the anchors D-235 then
# tightened, so it is not a prediction of what the judge would say today.
#
# Only `upheld` suppresses. A `retiered` item was changed to match the judge, so it is
# now expected to agree and a remaining disagreement is news, not a repeat.
