# Human verdicts on §5.8.5 judge findings (D-236), so a repeat audit reports what is NEW.
#
# D-235 adjudicated 25 disagreements between an item's declared tier and the tier the blind
# judge gave it. 13 were the judge being right and were fixed by re-tiering; 12 were the
# judge being wrong and, until D-236, were recorded nowhere - so the next `--judge` run would
# have re-reported them as twelve fresh findings.
#
# **Re-decided in D-237, not inherited.** The tier-5 prompt sentence lapsed all 12 `upheld`
# verdicts by design, and re-running the judge on exactly those items showed **8 of the 12
# had become moot** - the instrument now agrees, so there is nothing left to suppress and
# those entries were deleted rather than carried.
#
# **Re-decided again in D-238, and this is the second time a lapse was worth its cost.**
# Rewriting six `multiplication_division` stems and the whole `place_value` anchor ladder
# lapsed 9 of 20 verdicts. Re-judging exactly those nine: **7 now agree within tolerance.**
# Two `upheld` entries were deleted as moot - and both were items whose *content* D-238
# rewrote, so the judge calling them tier 2 had been right about the item all along and the
# D-235 verdict defending them had been wrong. Five were refreshed as `retiered`, one of
# them (`place_value-d4-200401`) converted from `upheld` after D-238 measured the reading
# that had justified it - "6,405 is a four-digit number" - to be carrying no work at all.
#
# **Two entries deleted as moot in D-273 (C1 Phase R), on the same reasoning D-238 used.**
# `place_value_compare` was re-authored: all 15 of its items asked "how many more" - subtraction
# word problems filed under a comparison skill - and now ask a comparison. Two of the 15 carried
# verdicts (`200403` retiered, `200504` upheld), and both verdicts are claims about questions
# that no longer exist, not stale hashes on surviving ones. Deleted rather than refreshed,
# because refreshing a fingerprint re-asserts a judgement nobody made.
#
# **One of the two leaves an open question, recorded rather than answered.** `200504` is
# declared tier 5 and D-238 upheld that against a stable judge reading of 3, arguing "arranging
# the digits is a real place-value insight". The old item made a student build *two* numbers and
# subtract; the new one builds *one*. That is less work, so the tier-5 case is **weaker than
# when it was upheld** - and this session did not measure it, because item-level verdicts in
# this topic are not supportable at any affordable n (8 of 28 items returned the same tier over
# four runs). It stays declared 5 and needs the next `--judge` run, which should test the
# tier-5 BUILD *clause* the way D-238 said, not this item.
#
# **The record is down to one entry, and the third lapse is the one that paid for itself.**
# D-273 added `correct_option` to `QuestionJudgePayload` - the judge had four options and a
# solution text but was never told which letter the key names, so asked whether an item was
# internally consistent it assumed `option_a` and rejected correct items. Adding the field
# lapsed all 16 remaining verdicts, exactly as `fingerprint`'s docstring says it must.
#
# Re-judging the whole bank (184 items, ~$1): **15 of the 16 became moot** and are deleted,
# leaving one. That is the same shape as D-237 (8 of 12) and D-238 (7 of 9), and it is the
# third time running that a lapse resolved more than it cost.
#
# **What the run does NOT establish, stated because it is tempting to claim:** that the
# answer key *caused* the agreement. This is n=1 against a judge whose run-to-run variance
# D-237 measured at 6 and 13 out of 16 on identical inputs, and the population differs from
# the baseline's. The verdicts are moot - that is a fact about the current instrument and is
# what decides their disposition - but "the key fixed them" is a hypothesis this run cannot
# separate from variance. A control would need the same items re-judged without the field.
#
# The one that survived is **clause-level, not item-level**, and its rationale says so:
# testing an item when the evidence points at a rubric clause is how D-235 came to defend
# four items it should have re-tiered.
#
# `fingerprint` scope depends on what the verdict claims (D-237):
#   upheld   - "the judge is wrong about this item": item payload + anchors + judge prompt.
#   retiered - "this item's tier should be X by its anchors": item payload + anchors only.
#              The judge prompt is not an input to a human reading of content against a
#              rubric, and must not be able to invalidate one.
#
# Only `upheld` suppresses. A `retiered` item was changed to match the judge, so it is now
# expected to agree and a remaining disagreement is news, not a repeat.
version: 1
adjudications:
- question_template_id: authored-fraction_operations-d4-100406
  decision: retiered
  decided_on: '2026-08-11'
  decided_in: D-273
  declared_difficulty: 5
  judge_difficulty: 3
  measured_in: D-234
  fingerprint: a9a7ad18b449ce04
  rationale: 'Re-decided in D-273 after correct_option was added to QuestionJudgePayload, which lapsed all 16
    verdicts by design. Re-judged: 15 became moot and were deleted; this one did not. Declared 5, judge 3, stable across
    D-235/D-238 and this run - dividing two fractions that share a denominator reduces to counting units, which
    is the judge''s reading and is hard to argue with. Held at 5 pending a per-clause look at the tier-5 anchor
    rather than at this item, on D-238''s precedent that evidence pointing at a rubric clause should not be
    spent testing one item.'
