# Internal curriculum taxonomy — skill prerequisite edges.
# Reference: docs/SPEC.md §5.7, §5.8.4 (prerequisite count feeds difficulty
# assignment), §5.11 (intervention routing to an easier prerequisite problem, S10).
#
# This is content only in S4 — there is no Postgres table for prerequisites yet
# (see DECISIONS.md). Consumers read this file directly through
# intellichoice_curriculum.content.load_curriculum().
prerequisites:
  - skill_id: linear_two_step
    prerequisite_skill_id: linear_one_step

  - skill_id: linear_neg_frac_coeff
    prerequisite_skill_id: linear_two_step

  - skill_id: linear_both_sides
    prerequisite_skill_id: linear_neg_frac_coeff

  - skill_id: linear_distribute
    prerequisite_skill_id: linear_both_sides

  - skill_id: fraction_add_sub_unlike
    prerequisite_skill_id: fraction_add_sub_like

  - skill_id: fraction_mul_div
    prerequisite_skill_id: fraction_add_sub_unlike

  - skill_id: place_value_compare
    prerequisite_skill_id: place_value_identify

  # multiplication_division (D-228). Two branches off the facts rather than one chain:
  # dividing within 100 uses the inverse of multiplication, so it needs the facts, but it
  # does not need multi-digit multiplication first.
  - skill_id: mult_multi_digit
    prerequisite_skill_id: mult_facts

  - skill_id: div_basic
    prerequisite_skill_id: mult_facts

  - skill_id: div_remainder
    prerequisite_skill_id: div_basic

  # C1 wave K-2 (D-273). Chains within a topic follow the ladder; the cross-topic edges are
  # the ones worth reading, because they are what routes a struggling grade-2 student back to
  # a grade-1 skill rather than to an easier version of the same one (SPEC §5.11).
  - skill_id: g1_add_within_20
    prerequisite_skill_id: g1_add_within_10

  - skill_id: g1_add_within_28
    prerequisite_skill_id: g1_add_within_20

  - skill_id: g1_sub_within_10
    prerequisite_skill_id: g1_add_within_10

  - skill_id: g1_sub_within_20
    prerequisite_skill_id: g1_sub_within_10

  - skill_id: g1_sub_three_numbers
    prerequisite_skill_id: g1_sub_within_20

  - skill_id: g1_wp_single_operation
    prerequisite_skill_id: g1_add_within_20

  - skill_id: g1_wp_choose_operation
    prerequisite_skill_id: g1_wp_single_operation

  # Grade 2 builds on grade 1, so an intervention can drop a band rather than only a tier.
  - skill_id: g2_add_within_100
    prerequisite_skill_id: g1_add_within_28

  - skill_id: g2_add_multi_digit
    prerequisite_skill_id: g2_add_within_100

  - skill_id: g2_add_three_numbers
    prerequisite_skill_id: g2_add_within_100

  - skill_id: g2_sub_two_digit
    prerequisite_skill_id: g1_sub_within_20

  - skill_id: g2_sub_multi_digit
    prerequisite_skill_id: g2_sub_two_digit

  - skill_id: g2_sub_three_numbers
    prerequisite_skill_id: g2_sub_two_digit

  - skill_id: g2_wp_single_operation
    prerequisite_skill_id: g1_wp_choose_operation

  - skill_id: g2_wp_measurement_context
    prerequisite_skill_id: g2_wp_single_operation

  - skill_id: g2_wp_multi_step
    prerequisite_skill_id: g2_wp_single_operation

  # ====================================================================================
  # C1 wave 3-5 (D-274). Edges into the existing bank as well as within the new topics,
  # because the 3-5 band is where the K-2 skills are actually used: multi-digit
  # multiplication rests on the times tables `multiplication_division` already teaches,
  # and decimal addition rests on `g2_add_multi_digit`'s column work.
  # ====================================================================================

  - skill_id: g4_mult_by_one_digit
    prerequisite_skill_id: mult_multi_digit

  - skill_id: g4_mult_two_by_two
    prerequisite_skill_id: g4_mult_by_one_digit

  - skill_id: g4_mult_large
    prerequisite_skill_id: g4_mult_two_by_two

  - skill_id: g4_div_by_one_digit
    prerequisite_skill_id: div_basic

  - skill_id: g4_div_by_two_digit
    prerequisite_skill_id: g4_div_by_one_digit

  - skill_id: decimal_add_sub
    prerequisite_skill_id: g2_add_multi_digit

  - skill_id: decimal_multiply
    prerequisite_skill_id: decimal_add_sub

  - skill_id: decimal_multiply
    prerequisite_skill_id: g4_mult_two_by_two

  - skill_id: decimal_divide
    prerequisite_skill_id: decimal_multiply

  - skill_id: decimal_divide
    prerequisite_skill_id: g4_div_by_two_digit

  - skill_id: number_odd_even
    prerequisite_skill_id: place_value_identify

  - skill_id: number_large_compare
    prerequisite_skill_id: place_value_compare

  - skill_id: number_rounding
    prerequisite_skill_id: number_large_compare

  - skill_id: measurement_length
    prerequisite_skill_id: g2_add_within_100

  - skill_id: measurement_weight
    prerequisite_skill_id: measurement_length

  - skill_id: measurement_capacity
    prerequisite_skill_id: measurement_length

  - skill_id: measurement_money
    prerequisite_skill_id: g2_add_within_100

  - skill_id: measurement_elapsed_time
    prerequisite_skill_id: g2_sub_two_digit

  - skill_id: measurement_area_volume
    prerequisite_skill_id: g4_mult_by_one_digit

  - skill_id: g3_wp_add_sub
    prerequisite_skill_id: g2_wp_single_operation

  - skill_id: g3_wp_mult_div
    prerequisite_skill_id: g3_wp_add_sub

  - skill_id: g3_wp_mult_div
    prerequisite_skill_id: mult_facts

  - skill_id: g3_wp_mixed
    prerequisite_skill_id: g3_wp_mult_div

  - skill_id: g4_wp_division
    prerequisite_skill_id: g4_div_by_one_digit

  - skill_id: g4_wp_division
    prerequisite_skill_id: g3_wp_mult_div

  - skill_id: g4_wp_decimals
    prerequisite_skill_id: decimal_add_sub

  - skill_id: g4_wp_formula_mixed
    prerequisite_skill_id: g4_wp_division

  - skill_id: g5_wp_fractions
    prerequisite_skill_id: fraction_add_sub_like

  - skill_id: g5_wp_decimals
    prerequisite_skill_id: decimal_multiply

  - skill_id: g5_wp_ratios_mixed
    prerequisite_skill_id: g5_wp_fractions

  # ====================================================================================
  # C1 waves 6-8 and 9-12 (D-277). Edges reach back into the earlier bands, because that
  # is where the prerequisite actually lives: quadratics rest on factorisation, which
