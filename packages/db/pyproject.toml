[project]
name = "intellichoice-db"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.51",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    "pydantic>=2.9",
    # AUD-C-21/D-166: only for policy constants (`access_probe_policy`). `intellichoice-shared`
    # depends on nothing but pydantic and imports nothing from here, so this is one-directional
    # and cannot cycle. Do not let it become a route for anything but shared constants.
    "intellichoice-shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intellichoice_db"]

[tool.uv.sources]
intellichoice-shared = { workspace = true }
