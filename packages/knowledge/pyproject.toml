[project]
name = "intellichoice-knowledge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "intellichoice-db",
    "intellichoice-shared",
    "intellichoice-adapters",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "llama-index-core>=0.14.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intellichoice_knowledge"]

[tool.uv.sources]
intellichoice-db = { workspace = true }
intellichoice-shared = { workspace = true }
intellichoice-adapters = { workspace = true }
