[project]
name = "intellichoice-curriculum"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "intellichoice-db",
    "intellichoice-shared",
    "intellichoice-adapters",
    # D-244: `configure_logging` so this package's runs are queryable rather than only
    # printable. The ops-task runs `loader` in ECS, so its stdout is already in CloudWatch -
    # it was simply unstructured, which is the difference between a log and a record.
    "intellichoice-observability",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "sympy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intellichoice_curriculum"]

[tool.uv.sources]
intellichoice-db = { workspace = true }
intellichoice-shared = { workspace = true }
intellichoice-adapters = { workspace = true }
intellichoice-observability = { workspace = true }
