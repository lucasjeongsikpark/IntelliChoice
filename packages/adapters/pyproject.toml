[project]
name = "intellichoice-adapters"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "intellichoice-shared",
    "intellichoice-observability",
    "pyjwt>=2.9",
    "sqlalchemy[asyncio]>=2.0.51",
    "aiomysql>=0.2.0",
    # aiomysql's optional RSA-based full-auth path for MySQL 8's default
    # caching_sha2_password plugin - undetected locally because the dev-compose
    # container's auth cache had already been warmed by repeated prior connections;
    # a fresh RDS instance's first connections hit full auth and fail without this
    # (found live during S32/D-084's first deploy).
    #
    # DO NOT REMOVE because "nothing imports it" - no first-party module does, and that
    # reasoning already produced one wrong carry-over (see the correction on D-168). The
    # importer is PyMySQL: `pymysql._auth` does
    # `from cryptography.hazmat.primitives.asymmetric import padding` and raises
    # "'cryptography' package is required for sha256_password or caching_sha2_password
    # auth methods" without it. No local test can catch its absence (warm auth cache);
    # only a fresh-database connection can.
    "cryptography>=42",
    "boto3>=1.43.55",
    "icalendar>=7.2.2",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intellichoice_adapters"]

[tool.uv.sources]
intellichoice-shared = { workspace = true }
intellichoice-observability = { workspace = true }
