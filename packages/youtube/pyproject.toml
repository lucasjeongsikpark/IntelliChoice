[project]
name = "intellichoice-youtube"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "intellichoice-db",
    "intellichoice-shared",
    "intellichoice-adapters",
    "intellichoice-curriculum",
    "pydantic>=2.9",
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intellichoice_youtube"]

[tool.uv.sources]
intellichoice-db = { workspace = true }
intellichoice-shared = { workspace = true }
intellichoice-adapters = { workspace = true }
intellichoice-curriculum = { workspace = true }
