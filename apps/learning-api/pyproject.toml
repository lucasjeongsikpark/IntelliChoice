[project]
name = "learning-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "intellichoice-shared",
    "intellichoice-adapters",
    "intellichoice-db",
    "intellichoice-curriculum",
    "intellichoice-memory",
    "intellichoice-observability",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-postgres>=3.1.0",
    "psycopg[binary,pool]>=3.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learning_api"]

[tool.uv.sources]
intellichoice-shared = { workspace = true }
intellichoice-adapters = { workspace = true }
intellichoice-db = { workspace = true }
intellichoice-curriculum = { workspace = true }
intellichoice-memory = { workspace = true }
intellichoice-observability = { workspace = true }
