# SPEC §5.32.4. Apps run natively on the host (`make dev-learning`/`dev-chat`), not as
# compose services - `host.docker.internal` is Docker Desktop's DNS name for the host
# from inside a container (works on macOS/Windows out of the box; a Linux host needs
# `extra_hosts: ["host.docker.internal:host-gateway"]`, not added here since this
# project's dev machines are macOS - see CLAUDE.md's environment).
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: learning-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8001"]

  - job_name: chat-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8002"]
