[project]
name = "intellichoice"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/*", "packages/*"]
# apps/learning-web and apps/chat-web are Node/Vite apps (S11/S16), not uv workspace members.
# packages/ui-brand is a shared CSS/asset package (S22.5), not a Python package.
exclude = ["apps/learning-web", "apps/chat-web", "packages/ui-brand"]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
    "pyright>=1.1",
    "pytest>=8.3",
    "httpx2>=2.12.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic autogenerates these in its own single-line-per-column style; not hand-written.
extend-exclude = ["packages/db/alembic/versions"]

[tool.ruff.format]
# D-417/C8: **the formatter reformats Python code blocks inside Markdown by default** (ruff 0.16.3
# does; measured - it considers 24 files under `docs/`). That is actively wrong for this repo: the
# write-ups quote snippets *to demonstrate a defect*, so reformatting one can destroy the thing
# being demonstrated. The first run collapsed a deliberately aligned `# <- no bar, no condition` in
# an audit finding, which is a historical record rather than code anyone runs.
#
# Scoped to the formatter rather than `extend-exclude`, which would also take it out of
# `ruff check` - and `ruff check` does not lint these blocks today, so there is nothing to change
# there.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
include = ["apps", "packages"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["apps", "packages"]
addopts = "--import-mode=importlib"
