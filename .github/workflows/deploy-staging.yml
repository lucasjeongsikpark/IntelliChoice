name: Deploy to Staging

# Manual trigger only for now (workflow_dispatch) - this redeploys real AWS
# infrastructure (S32/D-084's intellichoice-staging environment), not something that
# should fire unattended on every push until it's been run and reviewed at least once.
# Flip on the `push` trigger below once that's happened.
on:
  workflow_dispatch: {}
  # push:
  #   branches: [main]
  #   paths:
  #     - "apps/**"
  #     - "packages/**"
  #     - "curriculum/**"
  #     - "knowledge-content/**"

permissions:
  id-token: write # required for aws-actions/configure-aws-credentials' OIDC exchange
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 320503430250.dkr.ecr.us-east-1.amazonaws.com
  ECS_CLUSTER: intellichoice-staging
  # D-084: private subnet + shared ECS task SG, used by the one-off migration run-task
  # below (mirrors how ops-task has been invoked manually all session).
  PRIVATE_SUBNET: subnet-021ec8b4b06e6d2a1
  ECS_TASKS_SG: sg-0c3191c6140f84a57
  # S35: hardcoded to match this file's existing convention for infrastructure ids (the
  # distribution ids in the sync steps below, the subnet/SG above). The first version of
  # the security gate looked these up via cloudfront:ListDistributions instead and failed
  # live: that action is not granted to the GitHub deploy role. Hardcoding needs no new
  # permission and is no more brittle than the distribution ids already inlined below.
  LEARNING_CF_DOMAIN: d35dfnjzmgrm01.cloudfront.net
  CHAT_CF_DOMAIN: d222glidpp4azv.cloudfront.net

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::320503430250:role/intellichoice-staging-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: vars
        run: echo "tag=gha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # S35: the image tag is derived from the commit SHA, and the ECR repositories have
      # immutable tags on purpose (S32 hardening - an already-deployed tag can never be
      # silently repointed at different bytes). Those two facts together mean a re-run of
      # this workflow on an *unchanged* commit always died at the push step:
      #   "The image tag 'gha-<sha>' already exists ... and cannot be overwritten".
      # That is not a corner case here - re-running the deploy after fixing something
      # *outside* the app image (Terraform, IAM, a secret, infrastructure state) is the
      # normal repair loop, and it was structurally impossible. D-095's addendum hit this
      # as its bug #1 and worked around it by hand-deleting the stale tags; S35 hit it
      # again the same way, which is the signal it needed a real fix rather than a third
      # manual cleanup.
      #
      # Fix: treat "an image for this exact commit already exists" as success and reuse it,
      # rather than rebuilding and failing to push. This deliberately keeps the one-commit-
      # one-image property (the tag stays a truthful identifier of what is running, so
      # rollback targets stay meaningful) instead of the alternative of appending a
      # run-scoped suffix, which would let one commit sprawl across many near-identical
      # tags. Content-identical rebuilds are also not free on arm64 emulation, so skipping
      # them is a real speedup on the repair loop this fix exists to serve.
      # Uses batch-get-image, not the more obvious describe-images: this role is only
      # granted ecr:BatchGetImage, and describe-images is an implicitDeny for it. The first
      # version of this step called describe-images with 2>/dev/null, which would have
      # silently reported "needs a build" on every run - the permission error and a
      # genuinely absent image were indistinguishable - so the immutable-tag push would
      # have failed again anyway and this whole step would have been decoration. Hence also
      # the hard exit below rather than a fallback: an unreadable ECR is an error to
      # surface, not a reason to assume anything (SPEC's fail-closed rule applies to
      # tooling too).
      - name: Check whether this commit's images are already in ECR
        id: images
        run: |
          for app in learning-api chat-api; do
            if ! out=$(aws ecr batch-get-image --repository-name "$app" \
                         --image-ids imageTag="${{ steps.vars.outputs.tag }}" \
                         --output json 2>&1); then
              echo "FAIL: could not query ECR for $app - refusing to guess whether the image exists."
              echo "$out"
              exit 1
            fi
            found=$(printf '%s' "$out" | jq '.images | length')
            codes=$(printf '%s' "$out" | jq -r '[.failures[].failureCode] | join(",")')
            if [ "$found" -gt 0 ]; then
              echo "$app already has ${{ steps.vars.outputs.tag }} - reusing it."
              echo "${app//-/_}_exists=true" >> "$GITHUB_OUTPUT"
            elif [ "$codes" = "ImageNotFound" ] || [ -z "$codes" ]; then
              echo "$app needs a build for ${{ steps.vars.outputs.tag }}."
              echo "${app//-/_}_exists=false" >> "$GITHUB_OUTPUT"
            else
              echo "FAIL: unexpected ECR failure for $app: $codes"
              exit 1
            fi
          done

      # ARM64 to match Fargate's runtime_platform (D-084 - Fargate defaults to x86_64,
      # this deployment intentionally runs Graviton).
      - name: Build and push learning-api
        if: steps.images.outputs.learning_api_exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/learning-api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.ECR_REGISTRY }}/learning-api:${{ steps.vars.outputs.tag }}

      - name: Build and push chat-api
        if: steps.images.outputs.chat_api_exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/chat-api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.ECR_REGISTRY }}/chat-api:${{ steps.vars.outputs.tag }}

      # S34: found live, on this workflow's first-ever real run - every deploy before
      # this fix ran migrations against whatever image Terraform's last `ops_task` apply
      # happened to set (`s32-haiku-v1`, since nothing here had ever patched it), not the
      # image just built above. A migration script (or, this session, a bug fix the
      # migration step itself depended on) added since that apply would silently never
      # run. Mirrors "Deploy learning-api"'s own patch-image-then-register pattern below,
      # applied to the ops-task family - `run-task` naming the bare family (no revision
      # suffix) always resolves to the latest registered revision, so no other change is
      # needed to pick this up.
      - name: Deploy ops-task (patch image tag before running migrations against it)
        run: |
          aws ecs describe-task-definition --task-definition intellichoice-staging-ops-task \
            --query 'taskDefinition' | \
            python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          td = {k: d[k] for k in ('family','containerDefinitions','requiresCompatibilities','networkMode','cpu','memory','executionRoleArn','taskRoleArn','runtimePlatform') if k in d}
          for c in td['containerDefinitions']:
              c['image'] = c['image'].rsplit(':', 1)[0] + ':${{ steps.vars.outputs.tag }}'
          json.dump(td, sys.stdout)
          " > /tmp/ops-task-td.json
          aws ecs register-task-definition --cli-input-json file:///tmp/ops-task-td.json \
            --query 'taskDefinition.taskDefinitionArn' --output text

      # One-off Fargate task, same mechanism used manually throughout S32/D-084 - never
      # baked into container startup, and never `terraform apply` (the ecs-service
      # modules' `lifecycle.ignore_changes = [task_definition]` exists specifically so
      # this workflow's deploys aren't silently reverted by a routine apply).
      - name: Run Alembic migrations
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition intellichoice-staging-ops-task \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$PRIVATE_SUBNET],securityGroups=[$ECS_TASKS_SG],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"ops-task","command":["sh","-c","cd packages/db && alembic upgrade head"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          echo "Migration exit code: $EXIT_CODE"
          test "$EXIT_CODE" = "0"

      # S34: captured *before* either service redeploys, so the canary-bake step below
      # has a known-good revision to roll back to if the new one misbehaves. ECS keeps
      # every registered task-definition revision indefinitely (nothing here deregisters
      # old ones), so pointing a service back at this ARN is always valid.
      - name: Capture pre-deploy task definition ARNs (rollback targets)
        id: pre_deploy
        run: |
          LEARNING_PREV=$(aws ecs describe-services --cluster "$ECS_CLUSTER" \
            --services intellichoice-staging-learning-api \
            --query 'services[0].taskDefinition' --output text)
          CHAT_PREV=$(aws ecs describe-services --cluster "$ECS_CLUSTER" \
            --services intellichoice-staging-chat-api \
            --query 'services[0].taskDefinition' --output text)
          echo "learning=$LEARNING_PREV" >> "$GITHUB_OUTPUT"
          echo "chat=$CHAT_PREV" >> "$GITHUB_OUTPUT"

      # Patches only the image field onto the currently-running task definition (same
      # env vars, roles, etc. Terraform last applied) and registers a new revision -
      # mirrors the exact manual process used all session, not `terraform apply`.
      #
      # S39: the patch is scoped to the *app* container by name. It used to rewrite the tag
      # on every container in the definition, which was harmless while there was only one -
      # but the moment Terraform added the aws-otel-collector sidecar, that loop would have
      # rewritten `aws-otel-collector:v0.43.3` to `aws-otel-collector:gha-<sha>`, an image
      # that does not exist, and every deploy would have crash-looped into a circuit-breaker
      # rollback. Caught while adding the sidecar, before it shipped.
      - name: Deploy learning-api
        run: |
          aws ecs describe-task-definition --task-definition intellichoice-staging-learning-api \
            --query 'taskDefinition' | \
            python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          td = {k: d[k] for k in ('family','containerDefinitions','requiresCompatibilities','networkMode','cpu','memory','executionRoleArn','taskRoleArn','runtimePlatform') if k in d}
          app = [c for c in td['containerDefinitions'] if c['name'] == 'learning-api']
          assert len(app) == 1, f\"expected exactly one 'learning-api' container, found {len(app)}\"
          app[0]['image'] = app[0]['image'].rsplit(':', 1)[0] + ':${{ steps.vars.outputs.tag }}'
          json.dump(td, sys.stdout)
          " > /tmp/learning-api-td.json
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json file:///tmp/learning-api-td.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "$ECS_CLUSTER" --service intellichoice-staging-learning-api \
            --task-definition "$NEW_ARN" --force-new-deployment
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services intellichoice-staging-learning-api

      - name: Deploy chat-api
        run: |
          aws ecs describe-task-definition --task-definition intellichoice-staging-chat-api \
            --query 'taskDefinition' | \
            python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          td = {k: d[k] for k in ('family','containerDefinitions','requiresCompatibilities','networkMode','cpu','memory','executionRoleArn','taskRoleArn','runtimePlatform') if k in d}
          app = [c for c in td['containerDefinitions'] if c['name'] == 'chat-api']
          assert len(app) == 1, f\"expected exactly one 'chat-api' container, found {len(app)}\"
          app[0]['image'] = app[0]['image'].rsplit(':', 1)[0] + ':${{ steps.vars.outputs.tag }}'
          json.dump(td, sys.stdout)
          " > /tmp/chat-api-td.json
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json file:///tmp/chat-api-td.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "$ECS_CLUSTER" --service intellichoice-staging-chat-api \
            --task-definition "$NEW_ARN" --force-new-deployment
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services intellichoice-staging-chat-api

      # S35: a live assertion that the dev-only auth stand-in is really unreachable from
      # the public internet, checked against what is actually deployed rather than against
      # what the config says should be deployed.
      #
      # This exists because of a real P0 this session found: S33/D-085 "closed"
      # `POST /dev/token` by reverting `app_environment` to "staging" in
      # `terraform.tfvars` - but that file is gitignored and the apply was withheld, so
      # the fix existed only in one machine's local working tree. Both CloudFront
      # distributions kept serving a fully functional token-minting endpoint (any role,
      # any student) for two days, while DECISIONS.md recorded the finding as executed.
      # Config-level intent and deployed reality had no check tying them together.
      #
      # A 404 is the pass condition. Anything else - 200, 422 (the real symptom seen this
      # session: FastAPI validating a request body for a route that should not mint a
      # token), 500 - means it is reachable and this deploy must not be declared healthy.
      # Deliberately fails the workflow instead of triggering the rollback path below:
      # rolling back would move to an *older* image, which is more likely to be exposed,
      # not less.
      #
      # S36/D-097 changed what this step proves, and the distinction matters. `/dev/token`
      # is now reachable on staging *for a caller holding the Secrets Manager shared
      # secret* - the audit sessions' only authenticated path until S44. So the assertion
      # is no longer "the endpoint does not exist" but "the endpoint is closed to everyone
      # without the secret", which is checked two ways: no credential at all, and a wrong
      # credential. The wrong-credential probe is the one that would catch the failure mode
      # that actually worries me - a bug or misconfiguration that makes the comparison
      # vacuous (an unset secret treated as a match) would still 404 the no-header probe
      # while opening the endpoint to the whole internet.
      #
      # The positive path (correct secret -> 200) is deliberately NOT checked here: it
      # would mean copying the secret into GitHub Actions, giving a second system a copy of
      # a credential whose entire value is being held in one place. A staging token path
      # that is silently broken costs an audit session some confusion; a leaked one costs
      # more. For a future production environment no secret is configured at all, so both
      # probes below assert plain unreachability there, unchanged.
      - name: Verify /dev/token is closed on the public edge (security gate)
        run: |
          FAILED=0
          for entry in "learning:$LEARNING_CF_DOMAIN" "chat:$CHAT_CF_DOMAIN"; do
            app="${entry%%:*}"
            DOMAIN="${entry#*:}"
            if [ -z "$DOMAIN" ]; then
              echo "FAIL [$app]: no CloudFront domain configured to check."
              FAILED=1
              continue
            fi
            for probe in "no-credential:" "wrong-credential:not-the-staging-secret"; do
              label="${probe%%:*}"
              secret="${probe#*:}"
              if [ -n "$secret" ]; then
                CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
                  -X POST "https://${DOMAIN}/dev/token" \
                  -H 'Content-Type: application/json' \
                  -H "X-Staging-Token-Secret: ${secret}" \
                  -d '{"sub":"deploy-gate-probe","role":"student"}')
              else
                CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
                  -X POST "https://${DOMAIN}/dev/token" \
                  -H 'Content-Type: application/json' \
                  -d '{"sub":"deploy-gate-probe","role":"student"}')
              fi
              if [ "$CODE" = "404" ]; then
                echo "OK [$app/${label}]: /dev/token -> 404 via ${DOMAIN}"
              else
                echo "FAIL [$app/${label}]: /dev/token -> ${CODE} via ${DOMAIN} (expected 404 - the endpoint MINTS TOKENS for this caller)"
                FAILED=1
              fi
            done
          done
          if [ "$FAILED" != "0" ]; then
            echo "Security gate failed: the dev token endpoint is reachable on the public edge."
            exit 1
          fi

      # S34/SPEC §6.24 Phase 23 "Production Canary -> Metric Check -> Full Rollout",
      # translated to this deployment's real shape: `desired_count=1` per service (D-084's
      # cost posture) means there's no second task to shift live traffic to gradually, so
      # this is a time-boxed *bake* (both services already serving 100% of traffic on the
      # new revision, per `aws ecs wait services-stable` above) rather than a true
      # weighted traffic-split canary - simpler to build/operate, matches CLAUDE.md's
      # "optimize for reliability and low operational burden, not enterprise-scale
      # architecture" for a solo maintainer. ECS's own `deployment_circuit_breaker`
      # (terraform/modules/ecs-service) already catches a revision that never becomes
      # healthy at all; this step catches the case a revision *is* healthy but is quietly
      # serving bad responses (elevated 5xx/latency) once real traffic hits it - the
      # circuit breaker alone can't see that. 3 minutes is a deliberately short bake for a
      # low-traffic staging environment - long enough for a handful of real requests to
      # land and move the ALB's 1-minute-period metrics, short enough not to block a solo
      # maintainer's iteration loop.
      - name: Canary bake - wait, then check for alarm breaches
        run: |
          echo "Baking for 3 minutes before declaring the deploy healthy..."
          sleep 180
          BREACHED=$(aws cloudwatch describe-alarms \
            --alarm-names \
              intellichoice-staging-learning-api-5xx-rate \
              intellichoice-staging-learning-api-p95-latency \
              intellichoice-staging-chat-api-5xx-rate \
              intellichoice-staging-chat-api-p95-latency \
            --state-value ALARM \
            --query 'MetricAlarms[].AlarmName' --output text)
          if [ -n "$BREACHED" ]; then
            echo "ALARM BREACHED: $BREACHED"
            echo "breached=true" >> "$GITHUB_OUTPUT"
          else
            echo "No alarms breached during the bake period."
            echo "breached=false" >> "$GITHUB_OUTPUT"
          fi
        id: canary_check

      - name: Roll back both services to their pre-deploy revisions (only if the bake failed)
        if: steps.canary_check.outputs.breached == 'true'
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service intellichoice-staging-learning-api \
            --task-definition "${{ steps.pre_deploy.outputs.learning }}" --force-new-deployment
          aws ecs update-service --cluster "$ECS_CLUSTER" --service intellichoice-staging-chat-api \
            --task-definition "${{ steps.pre_deploy.outputs.chat }}" --force-new-deployment
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" \
            --services intellichoice-staging-learning-api intellichoice-staging-chat-api
          echo "Rolled back to the pre-deploy task definitions - failing the workflow."
          exit 1

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Same-origin CloudFront routing (D-084) - empty API_BASE means every request
      # stays relative to the CloudFront domain the app is served from, so no absolute
      # URL/CORS config is needed at build time.
      - name: Build learning-web
        working-directory: apps/learning-web
        env:
          VITE_LEARNING_API_URL: ""
        run: |
          npm ci
          npm run build

      - name: Build chat-web
        working-directory: apps/chat-web
        env:
          VITE_CHAT_API_URL: ""
        run: |
          npm ci
          npm run build

      - name: Sync learning-web to S3 + invalidate CloudFront
        run: |
          aws s3 sync apps/learning-web/dist/ s3://intellichoice-staging-learning-web-320503430250/ --delete
          aws cloudfront create-invalidation --distribution-id E371R2SNCXJW2C --paths "/*"

      - name: Sync chat-web to S3 + invalidate CloudFront
        run: |
          aws s3 sync apps/chat-web/dist/ s3://intellichoice-staging-chat-web-320503430250/ --delete
          aws cloudfront create-invalidation --distribution-id E3EP2M0Q2XRXWZ --paths "/*"

      - name: Smoke test (through the public CloudFront URLs, not curl-to-ALB)
        run: |
          curl -sf -o /dev/null "https://$LEARNING_CF_DOMAIN/"
          curl -sf -o /dev/null "https://$CHAT_CF_DOMAIN/"
          echo "Both frontends responding."
