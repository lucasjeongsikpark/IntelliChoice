name: Deploy to Staging

# Manual trigger only for now (workflow_dispatch) - this redeploys real AWS
# infrastructure (S32/D-084's intellichoice-staging environment), not something that
# should fire unattended on every push until it's been run and reviewed at least once.
# Flip on the `push` trigger below once that's happened.
on:
  workflow_dispatch: {}
  # push:
  #   branches: [main]
  #   paths:
  #     - "apps/**"
  #     - "packages/**"
  #     - "curriculum/**"
  #     - "knowledge-content/**"

permissions:
  id-token: write # required for aws-actions/configure-aws-credentials' OIDC exchange
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 320503430250.dkr.ecr.us-east-1.amazonaws.com
  ECS_CLUSTER: intellichoice-staging
  # D-084: private subnet + shared ECS task SG, used by the one-off migration run-task
  # below (mirrors how ops-task has been invoked manually all session).
  PRIVATE_SUBNET: subnet-021ec8b4b06e6d2a1
  ECS_TASKS_SG: sg-0c3191c6140f84a57

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC, no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::320503430250:role/intellichoice-staging-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: vars
        run: echo "tag=gha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ARM64 to match Fargate's runtime_platform (D-084 - Fargate defaults to x86_64,
      # this deployment intentionally runs Graviton).
      - name: Build and push learning-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/learning-api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.ECR_REGISTRY }}/learning-api:${{ steps.vars.outputs.tag }}

      - name: Build and push chat-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/chat-api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.ECR_REGISTRY }}/chat-api:${{ steps.vars.outputs.tag }}

      # One-off Fargate task, same mechanism used manually throughout S32/D-084 - never
      # baked into container startup, and never `terraform apply` (the ecs-service
      # modules' `lifecycle.ignore_changes = [task_definition]` exists specifically so
      # this workflow's deploys aren't silently reverted by a routine apply).
      - name: Run Alembic migrations
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition intellichoice-staging-ops-task \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$PRIVATE_SUBNET],securityGroups=[$ECS_TASKS_SG],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"ops-task","command":["sh","-c","cd packages/db && alembic upgrade head"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          echo "Migration exit code: $EXIT_CODE"
          test "$EXIT_CODE" = "0"

      # Patches only the image field onto the currently-running task definition (same
      # env vars, roles, etc. Terraform last applied) and registers a new revision -
      # mirrors the exact manual process used all session, not `terraform apply`.
      - name: Deploy learning-api
        run: |
          aws ecs describe-task-definition --task-definition intellichoice-staging-learning-api \
            --query 'taskDefinition' | \
            python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          td = {k: d[k] for k in ('family','containerDefinitions','requiresCompatibilities','networkMode','cpu','memory','executionRoleArn','taskRoleArn','runtimePlatform') if k in d}
          for c in td['containerDefinitions']:
              c['image'] = c['image'].rsplit(':', 1)[0] + ':${{ steps.vars.outputs.tag }}'
          json.dump(td, sys.stdout)
          " > /tmp/learning-api-td.json
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json file:///tmp/learning-api-td.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "$ECS_CLUSTER" --service intellichoice-staging-learning-api \
            --task-definition "$NEW_ARN" --force-new-deployment
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services intellichoice-staging-learning-api

      - name: Deploy chat-api
        run: |
          aws ecs describe-task-definition --task-definition intellichoice-staging-chat-api \
            --query 'taskDefinition' | \
            python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          td = {k: d[k] for k in ('family','containerDefinitions','requiresCompatibilities','networkMode','cpu','memory','executionRoleArn','taskRoleArn','runtimePlatform') if k in d}
          for c in td['containerDefinitions']:
              c['image'] = c['image'].rsplit(':', 1)[0] + ':${{ steps.vars.outputs.tag }}'
          json.dump(td, sys.stdout)
          " > /tmp/chat-api-td.json
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json file:///tmp/chat-api-td.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster "$ECS_CLUSTER" --service intellichoice-staging-chat-api \
            --task-definition "$NEW_ARN" --force-new-deployment
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services intellichoice-staging-chat-api

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Same-origin CloudFront routing (D-084) - empty API_BASE means every request
      # stays relative to the CloudFront domain the app is served from, so no absolute
      # URL/CORS config is needed at build time.
      - name: Build learning-web
        working-directory: apps/learning-web
        env:
          VITE_LEARNING_API_URL: ""
        run: |
          npm ci
          npm run build

      - name: Build chat-web
        working-directory: apps/chat-web
        env:
          VITE_CHAT_API_URL: ""
        run: |
          npm ci
          npm run build

      - name: Sync learning-web to S3 + invalidate CloudFront
        run: |
          aws s3 sync apps/learning-web/dist/ s3://intellichoice-staging-learning-web-320503430250/ --delete
          aws cloudfront create-invalidation --distribution-id E371R2SNCXJW2C --paths "/*"

      - name: Sync chat-web to S3 + invalidate CloudFront
        run: |
          aws s3 sync apps/chat-web/dist/ s3://intellichoice-staging-chat-web-320503430250/ --delete
          aws cloudfront create-invalidation --distribution-id E3EP2M0Q2XRXWZ --paths "/*"

      - name: Smoke test (through the public CloudFront URLs, not curl-to-ALB)
        run: |
          curl -sf -o /dev/null https://d35dfnjzmgrm01.cloudfront.net/
          curl -sf -o /dev/null https://d222glidpp4azv.cloudfront.net/
          echo "Both frontends responding."
